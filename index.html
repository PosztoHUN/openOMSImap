<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Players – Budapest</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0f1419;--panel:#171e26;--text:#e6edf3;--mute:#8b98a5;--acc:#ffb703;--foot:#4cc9f0}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
  aside{width:300px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;z-index:1}
  h1{font-size:16px;margin:0}
  .status{color:var(--mute);font-size:12px}
  .status.ok::before{content:"● ";color:#3fb950}
  .status.err::before{content:"● ";color:#f85149}
  input[type=text]{width:100%;padding:6px;background:var(--bg);color:var(--text);border:1px solid #2b3643;border-radius:6px}
  label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
  button{background:#26323f;color:var(--text);border:1px solid #2b3643;border-radius:6px;padding:6px 8px;cursor:pointer}
  button.on{background:var(--acc);color:#000}
  .row{display:flex;gap:6px}.row button{flex:1}
  .p{padding:8px;border-radius:8px;background:var(--bg);cursor:pointer;border-left:3px solid var(--acc)}
  .p.foot{border-color:var(--foot)}
  .p.sel{outline:1px solid #fff}
  .p b{display:block}
  .p small{color:var(--mute)}
  .row input{flex:1;min-width:0}
  main{flex:1;position:relative}
  #map{position:absolute;inset:0}
  #map.cal{cursor:crosshair}
  .mk{position:relative;width:26px;height:26px}
  .mk svg{display:block}
  .lb{position:absolute;left:28px;top:4px;white-space:nowrap;background:rgba(0,0,0,.75);color:#fff;font:bold 12px system-ui;padding:2px 6px;border-radius:4px}
  @media(max-width:700px){body{flex-direction:column-reverse}aside{width:100%;max-height:45vh}main{min-height:50vh}}
</style>
</head>
<body>
<aside>
  <h1>🚌 Online players (<span id="n">0</span>)</h1>
  <div id="st" class="status">connecting…</div>
  <input type="text" id="url" placeholder="Players endpoint URL">
  <label><input type="checkbox" id="follow" checked> Auto-fit to players</label>
  <label><input type="checkbox" id="flip"> Flip Y axis</label>
  <div class="row"><button id="cal">📍 Calibrate</button><button id="reset">Reset</button><button id="copy">Copy</button></div>
  <div class="row"><input type="text" id="ll" placeholder="real lat, lon (paste from Google Maps)"><button id="setll" style="flex:none">Set</button></div>
  <div id="calst" class="status"></div>
  <div id="list"></div>
</aside>
<main><div id="map"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DEFAULT_URL = "https://discuss-rich-power-colony.trycloudflare.com/players";
const POLL_MS = 2000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

// ---------- map ----------
const map = L.map("map", {zoomControl:true}).setView([47.4979, 19.0402], 12);
// Same OpenStreetMap data (stops, lanes, labels), no API key. Switch layers top-right if one fails.
const osmfr = L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
  subdomains: "abc", maxZoom: 20,
  attribution: "&copy; OpenStreetMap contributors, tiles by OpenStreetMap France"
});
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Tiles &copy; Esri"
});
// OSM's own server blocks pages opened from a file:// path (no Referer); it works if the page is served over http(s).
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
});
// Served over http(s) (e.g. GitHub Pages) -> standard OSM works; opened as a local file -> use OSM France.
(location.protocol.startsWith("http") ? osm : osmfr).addTo(map);
L.control.layers({"OpenStreetMap France": osmfr, "Esri Streets": esri, "OpenStreetMap": osm}, null, {position:"topright"}).addTo(map);

// ---------- game coords -> lat/lon ----------
// Game (x,y) is treated as metres. w = A*z + B (complex similarity), relative to a Budapest origin.
// Calibrate by clicking where a player really is (1 point = offset, 2 distant points = scale + rotation).
const O = {lat:47.4979, lon:19.0402}, M = 111320, KX = M*Math.cos(O.lat*Math.PI/180);
const cmul = (a,b)=>[a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];
const cdiv = (a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d];};
const csub = (a,b)=>[a[0]-b[0],a[1]-b[1]], cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]];
let anchors = store.get("anchors4", []);   // [{z:[x,y], w:[east,north]}]
$("flip").checked = store.get("flip", false);
let A=[1,0], B=[0,0];

// Built-in anchor: game (7986.6, 249.0) = 47.501781, 19.135568 (real position at the Örs vezér tere terminal, given by the player).
// Replace it any time with a real calibration click.
// Paste the output of the "Copy" button here so every visitor gets the same calibration.
const ll2w = (lat,lon) => [(lon-O.lon)*KX, (lat-O.lat)*M];
// Real pairs (game x,y <-> real lat,lon) around Örs vezér tere / Kincsem Park. All pairs are combined with a least-squares
// fit (scale + rotation + shift), so small disagreements between the game map and OSM are averaged out.
const DEFAULT_ANCHORS = [
  {z:[7986.6,249.0], w:ll2w(47.50178104795657, 19.135567859416135)},   // terminal (GPS, confirmed good)
  {z:[7137.4,157.8], w:ll2w(47.49471320266731, 19.13875500486254)},    // ~850 units away
  {z:[6962.4,-23.7], w:ll2w(47.49346893716034, 19.141309058848027)},   // ~1060 units away
  {z:[6818.2,115.9], w:ll2w(47.49193384085207, 19.139208527755756)},   // Kincsem Park area
  {z:[3635.5,122.4], w:ll2w(47.465386870869146, 19.152781071797495)},  // ~4350 units from the terminal
  {z:[6771.6,208.4], w:ll2w(47.491031281555905, 19.138060542358012)},
  {z:[3765.0,-87.5], w:ll2w(47.46742458378954, 19.15467575481523)},
  {z:[3893.6,-296.1], w:ll2w(47.46932020730951, 19.15660665343917)},
  {z:[4001.4,-478.4], w:ll2w(47.470805142072706, 19.158178427895294)},
  {z:[3768.7,-624.6], w:ll2w(47.46865146094915, 19.1608114709936)},
  {z:[3636.5,-918.6], w:ll2w(47.468400960006875, 19.164464076538216)},
  {z:[3860.8,-973.4], w:ll2w(47.47046092440347, 19.164906002721953)}

  // Left out: they disagree with the three above by ~13 m. Re-add after re-measuring:
  // {z:[7915.0,175.7], w:ll2w(47.50115692879961, 19.136699220095753)},
  // {z:[7858.9,169.6], w:ll2w(47.50089818079121, 19.137008533410782)},
];
const DEF = {z:[7986.6,249.0], w:[(19.135567859416135-O.lon)*KX, (47.50178104795657-O.lat)*M]};
// Game axes are rotated vs. the real map: driving real south moves game x negative, so game +x = real north.
// That is a +90° rotation (A = i). A single calibration point keeps this rotation; two distant points refine it.
const ROT = [0,1];
let fitRms = null;
// The game map is slightly warped compared with OSM (local rotation/scale differ by a few degrees between areas), so one
// global similarity cannot match every anchor. After the global fit, each anchor's leftover error is spread to nearby
// positions (inverse-distance weighted); far from all anchors the correction fades to zero. Anchors then match exactly.
const CORR_R = 1500;   // game units: beyond roughly this distance from every anchor the correction fades out
let RES = [];
const currentList = () => anchors.length ? anchors : ($("flip").checked ? [] : (DEFAULT_ANCHORS.length ? DEFAULT_ANCHORS : [DEF]));
function solve(){
  solveFit();
  RES = currentList().map(q => ({z:q.z, r:csub(q.w, cadd(cmul(A,q.z),B))}));
}
function solveFit(){
  A=ROT; B=[0,0]; fitRms=null;
  const list = anchors.length ? anchors : ($("flip").checked ? [] : (DEFAULT_ANCHORS.length ? DEFAULT_ANCHORS : [DEF]));
  const n = list.length;
  if(n>=2){
    const zm=[list.reduce((a,p)=>a+p.z[0],0)/n, list.reduce((a,p)=>a+p.z[1],0)/n];
    const wm=[list.reduce((a,p)=>a+p.w[0],0)/n, list.reduce((a,p)=>a+p.w[1],0)/n];
    let num=[0,0], den=0;
    for(const p of list){
      const dz=csub(p.z,zm), dw=csub(p.w,wm);
      num=cadd(num, cmul(dw,[dz[0],-dz[1]])); den+=dz[0]*dz[0]+dz[1]*dz[1];
    }
    if(den>1250){            // points spread out by more than ~50 units
      A=[num[0]/den, num[1]/den]; B=csub(wm,cmul(A,zm));
      fitRms=Math.sqrt(list.reduce((a,p)=>{const e=csub(cadd(cmul(A,p.z),B),p.w);return a+e[0]*e[0]+e[1]*e[1];},0)/n);
      return;
    }
  }
  if(n>=1){ const p=list[n-1]; B=csub(p.w,cmul(A,p.z)); }
}
const zOf = p => [p.x, $("flip").checked ? -p.y : p.y];
function toLatLng(p){
  if(p.lat!=null && p.lon!=null) return [p.lat,p.lon];
  const z = zOf(p);
  let w = cadd(cmul(A,z),B);
  if(RES.length){
    let nx=0, ny=0, den=1/(CORR_R*CORR_R);
    for(const q of RES){
      const dx=z[0]-q.z[0], dy=z[1]-q.z[1], k=1/(dx*dx+dy*dy+25);
      nx+=k*q.r[0]; ny+=k*q.r[1]; den+=k;
    }
    w = [w[0]+nx/den, w[1]+ny/den];
  }
  return [O.lat + w[1]/M, O.lon + w[0]/KX];
}
function calText(){
  const deg = Math.atan2(A[1],A[0])*180/Math.PI, sc = Math.hypot(A[0],A[1]);
  $("calst").textContent = (anchors.length || DEFAULT_ANCHORS.length)
    ? `Calibrated with ${anchors.length || DEFAULT_ANCHORS.length} point(s) · scale ${sc.toFixed(3)} · rotation ${deg.toFixed(1)}°` + (fitRms!=null ? ` · global misfit ${fitRms.toFixed(1)} m (local correction on)` : "")
    : ($("flip").checked ? "Not calibrated: select a player, press Calibrate, click where they really are."
       : "Using built-in estimate (one point, 90° rotation assumed). For exact placement: select a player, press Calibrate, click their real position.");
}
solve(); calText();

// ---------- state ----------
let players = [], selected = null, calMode = false;
const markers = new Map();

function busName(path){
  const parts = String(path).split("/");
  const file = (parts.pop()||"").replace(/\.bus$/i,"");
  const model = parts.length ? parts[parts.length-1] : "";
  return model ? `${model} (${file})` : file;
}

function icon(p){
  const col = p.on_foot ? "#4cc9f0" : "#ffb703";
  let h = p.heading||0;
  if($("flip").checked) h = 180 - h;
  h -= Math.atan2(A[1],A[0])*180/Math.PI;
  const label = p.name + (!p.on_foot && p.line ? ` · ${p.line}` + (p.destination ? ` → ${p.destination}` : "") : "");
  return L.divIcon({
    className:"", iconSize:[26,26], iconAnchor:[13,13],
    html:`<div class="mk"><svg width="26" height="26" viewBox="-13 -13 26 26" style="transform:rotate(${h}deg)">
      <path d="M0-11L7 8L0 4L-7 8Z" fill="${col}" stroke="#000" stroke-width="1.5"/></svg>
      <span class="lb">${esc(label)}</span></div>`
  });
}

function renderMarkers(){
  const seen = new Set();
  for(const p of players){
    seen.add(p.id);
    const ll = toLatLng(p);
    let m = markers.get(p.id);
    if(!m){ m = L.marker(ll,{icon:icon(p)}).addTo(map); m.on("click",()=>select(p.id)); markers.set(p.id,m); }
    else { m.setLatLng(ll); m.setIcon(icon(p)); }
  }
  for(const [id,m] of markers) if(!seen.has(id)){ map.removeLayer(m); markers.delete(id); }
}

function renderList(){
  $("n").textContent = players.length;
  $("list").innerHTML = players.map(p => `
    <div class="p ${p.on_foot?"foot":""} ${p.id===selected?"sel":""}" data-id="${p.id}">
      <b>${esc(p.name)}</b>
      <small>${p.on_foot ? "On foot" : "Line <b style='display:inline;color:var(--acc)'>"+esc(p.line||"–")+"</b> → "+esc(p.destination||"–")}<br>
      ${!p.on_foot && p.tour ? "Tour: "+esc(p.tour)+"<br>" : ""}
      ${!p.on_foot && p.bus ? "Bus: "+esc(busName(p.bus))+"<br>" : ""}
      ${Math.round(p.speed_kmh||0)} km/h · x ${Number(p.x).toFixed(1)}, y ${Number(p.y).toFixed(1)}</small>
    </div>`).join("") || '<div class="status">Nobody online</div>';
}

function fit(){
  if(!players.length) return;
  const pts = players.map(toLatLng);
  if(pts.length===1) map.setView(pts[0], Math.max(map.getZoom(),15), {animate:false});
  else map.fitBounds(L.latLngBounds(pts).pad(0.3), {animate:false, maxZoom:16});
}

function select(id){
  selected = id; renderList();
  const p = players.find(p=>p.id===id);
  if(p){ $("follow").checked=false; map.setView(toLatLng(p), Math.max(map.getZoom(),15)); }
}
$("list").onclick = e => { const el = e.target.closest(".p"); if(!el) return; const p = players.find(p => String(p.id) === el.dataset.id); if(p) select(p.id); };

// user interaction turns off auto-fit
["mousedown","wheel","touchstart"].forEach(ev => $("map").addEventListener(ev, ()=>{ $("follow").checked=false; }, {passive:true}));

// ---------- calibration ----------
$("cal").onclick = () => {
  const p = players.find(p=>p.id===selected) || (players.length===1 ? players[0] : null);
  if(!p){ $("calst").textContent = "Select a player in the list first."; return; }
  selected = p.id; calMode = true; $("cal").classList.add("on"); $("map").classList.add("cal");
  $("calst").textContent = `Click the map where ${p.name} actually is…`;
};
map.on("click", e => {
  if(!calMode) return;
  const p = players.find(p=>p.id===selected); if(!p) return;
  const w = [(e.latlng.lng-O.lon)*KX, (e.latlng.lat-O.lat)*M];
  anchors.push({z:zOf(p), w}); anchors = anchors.slice(-6); store.set("anchors4", anchors);
  calMode=false; $("cal").classList.remove("on"); $("map").classList.remove("cal");
  solve(); calText(); renderMarkers(); renderList();
});
$("setll").onclick = () => {
  const m = $("ll").value.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
  const p = players.find(p=>p.id===selected) || (players.length===1 ? players[0] : null);
  if(!m){ $("calst").textContent = "Enter coordinates like: 47.50179, 19.13557"; return; }
  if(!p){ $("calst").textContent = "Select a player in the list first."; return; }
  const lat = +m[1], lon = +m[2];
  anchors.push({z:zOf(p), w:[(lon-O.lon)*KX, (lat-O.lat)*M]}); anchors = anchors.slice(-6); store.set("anchors4", anchors);
  solve(); calText(); renderMarkers(); renderList();
};
// Quick calibration: right-click (long-press on touch) the map where the selected player really is.
map.on("contextmenu", e => {
  const p = players.find(p=>p.id===selected) || (players.length===1 ? players[0] : null);
  if(!p){ $("calst").textContent = "Select a player in the list first."; return; }
  anchors.push({z:zOf(p), w:[(e.latlng.lng-O.lon)*KX, (e.latlng.lat-O.lat)*M]});
  anchors = anchors.slice(-6); store.set("anchors4", anchors);
  solve(); calText(); renderMarkers(); renderList();
});
$("copy").onclick = async () => {
  const txt = JSON.stringify(anchors);
  try{ await navigator.clipboard.writeText(txt); $("calst").textContent = "Copied calibration: " + txt; }
  catch(e){ prompt("Copy this calibration:", txt); }
};
$("reset").onclick = () => { anchors=[]; store.set("anchors4",[]); solve(); calText(); renderMarkers(); };
$("flip").onchange = () => { store.set("flip",$("flip").checked); anchors=[]; store.set("anchors4",[]); solve(); calText(); renderMarkers(); if($("follow").checked) fit(); };

// ---------- polling ----------
// URL priority: ?api=... in the page address > saved value > DEFAULT_URL.
// If DEFAULT_URL changed since the visitor's last visit (new tunnel), the new default replaces the stale saved one.
const qp = new URLSearchParams(location.search).get("api");
if(qp){ store.set("url", qp); }
else if(store.get("defSeen", null) !== DEFAULT_URL){ store.set("url", DEFAULT_URL); }
store.set("defSeen", DEFAULT_URL);
$("url").value = store.get("url", DEFAULT_URL);

let timer = null, failures = 0, polling = false;
const cleanUrl = () => $("url").value.trim();
$("url").onchange = () => { store.set("url", cleanUrl()); failures = 0; poll(); };

function schedule(){
  clearTimeout(timer);
  // back off 2s -> 4s -> 8s ... up to 30s while the server is unreachable; reset after a success
  const delay = failures ? Math.min(POLL_MS * 2 ** failures, 30000) : POLL_MS;
  timer = setTimeout(poll, delay);
}

async function poll(){
  if(polling) return;           // never run two requests at once
  polling = true;
  clearTimeout(timer);
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 8000);
  try{
    const res = await fetch(cleanUrl(), {cache:"no-store", signal:ctrl.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error("response is not a JSON list");
    players = data.filter(p => p && ((typeof p.x==="number" && typeof p.y==="number") || (p.lat!=null && p.lon!=null)));
    failures = 0;
    $("st").className = "status ok"; $("st").textContent = "updated " + new Date().toLocaleTimeString();
    renderMarkers(); renderList();
    if($("follow").checked) fit();
  }catch(err){
    failures++;
    const msg = err.name==="AbortError" ? "timeout" : err.message;
    $("st").className = "status err";
    $("st").textContent = "can't reach server (" + msg + "). The tunnel is probably down or its URL changed " +
      "(trycloudflare URLs change on every restart) - paste the new URL above. Retrying in " +
      Math.round(Math.min(POLL_MS * 2 ** failures, 30000) / 1000) + "s.";
  }finally{
    clearTimeout(to);
    polling = false;
    schedule();
  }
}
poll();
</script>
</body>
</html>
