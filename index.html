<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>openOMSI – Játékosok</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;

        .route {
            font-size: 30px;

        }

            font-size: 18px;

<body>

<header>
    <h1>🚌 openOMSI – Játékosok</h1>
    <div class="status">
        Állapot:
        <span id="status" class="offline">kapcsolódás...</span>
        · Játékosok: <span id="count">0</span>
    </div>
</header>

<main>
    <div id="players">
        <div class="empty">Játékoslista betöltése...</div>
    </div>
</main>

<footer>
    openOMSI szerver · Automatikus frissítés: 5 másodperc
</footer>

<script>
const API_URL =
    "https://review-incomplete-legs-border.trycloudflare.com/players";

const REFRESH_MS = 5000;

function escapeHtml(value) {
    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function busName(path) {
    if (!path) return "Ismeretlen";

    // Csak a fájlnevet mutatjuk
    const parts = path.split("/");
    return parts[parts.length - 1];
}

function formatSpeed(speed) {
    if (speed === null || speed === undefined) {
        return "–";
    }

    return Number(speed).toFixed(1) + " km/h";
}

function renderPlayers(players) {
    const container = document.getElementById("players");
    const count = document.getElementById("count");

    count.textContent = players.length;

    if (!players.length) {
        container.innerHTML = `
            <div class="empty">
                Jelenleg nincs játékos a szerveren.
            </div>
        `;
        return;
    }

    container.innerHTML = players.map(player => `
        <div class="player">

            <div class="player-header">
                <div class="player-name">
                    ${escapeHtml(player.name)}
                </div>

                <div class="player-id">
                    #${escapeHtml(player.id)}
                </div>
            </div>

            <div class="route">
                ${escapeHtml(player.line || "–")}
            </div>

            <div class="destination">
                ${escapeHtml(player.destination || "Nincs megadva")}
            </div>

            <div class="row">
                <span class="label">Jármű</span>
                <span class="value">
                    ${escapeHtml(busName(player.bus))}
                </span>
            </div>

            <div class="row">
                <span class="label">Túra</span>
                <span class="value">
                    ${escapeHtml(player.tour || "–")}
                </span>
            </div>

            <div class="row">
                <span class="label">Sebesség</span>
                <span class="value speed">
                    ${formatSpeed(player.speed_kmh)}
                </span>
            </div>

            <div class="row">
                <span class="label">Állapot</span>
                <span class="value">
                    ${player.on_foot ? "Gyalog" : "Vezet"}
                </span>
            </div>

        </div>
    `).join("");
}

async function loadPlayers() {
    const status = document.getElementById("status");

    try {
        const response = await fetch(API_URL + "?t=" + Date.now(), {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const players = await response.json();

        renderPlayers(players);

        status.textContent = "online";
        status.className = "online";

    } catch (error) {
        console.error("Játékoslista hiba:", error);

        status.textContent = "offline";
        status.className = "offline";

        document.getElementById("players").innerHTML = `
            <div class="empty">
                Nem sikerült lekérni a szerver játékoslistáját.<br>
                <small>${escapeHtml(error.message)}</small>
            </div>
        `;
    }
}

loadPlayers();
setInterval(loadPlayers, REFRESH_MS);
</script>

</body>
</html>
