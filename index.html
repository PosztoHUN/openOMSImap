<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Players – Budapest</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0f1419;--panel:#171e26;--text:#e6edf3;--mute:#8b98a5;--acc:#ffb703;--foot:#4cc9f0}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
  aside{width:300px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;z-index:1}
  h1{font-size:16px;margin:0}
  .status{color:var(--mute);font-size:12px}
  .status.ok::before{content:"● ";color:#3fb950}
  .status.err::before{content:"● ";color:#f85149}
  input[type=text]{width:100%;padding:6px;background:var(--bg);color:var(--text);border:1px solid #2b3643;border-radius:6px}
  label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
  button{background:#26323f;color:var(--text);border:1px solid #2b3643;border-radius:6px;padding:6px 8px;cursor:pointer}
  button.on{background:var(--acc);color:#000}
  .row{display:flex;gap:6px}.row button{flex:1}
  .p{padding:8px;border-radius:8px;background:var(--bg);cursor:pointer;border-left:3px solid var(--acc)}
  .p.foot{border-color:var(--foot)}
  .p.sel{outline:1px solid #fff}
  .p b{display:block}
  .p small{color:var(--mute)}
  main{flex:1;position:relative}
  #map{position:absolute;inset:0}
  #map.cal{cursor:crosshair}
  .mk{position:relative;width:26px;height:26px}
  .mk svg{display:block}
  .lb{position:absolute;left:28px;top:4px;white-space:nowrap;background:rgba(0,0,0,.75);color:#fff;font:bold 12px system-ui;padding:2px 6px;border-radius:4px}
  @media(max-width:700px){body{flex-direction:column-reverse}aside{width:100%;max-height:45vh}main{min-height:50vh}}
</style>
</head>
<body>
<aside>
  <h1>🚌 Online players (<span id="n">0</span>)</h1>
  <div id="st" class="status">connecting…</div>
  <input type="text" id="url" placeholder="Players endpoint URL">
  <label><input type="checkbox" id="follow" checked> Auto-fit to players</label>
  <label><input type="checkbox" id="flip"> Flip Y axis</label>
  <div class="row"><button id="cal">📍 Calibrate</button><button id="reset">Reset</button></div>
  <div id="calst" class="status"></div>
  <div id="list"></div>
</aside>
<main><div id="map"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DEFAULT_URL = "https://kong-conditions-drain-purposes.trycloudflare.com/players";
const POLL_MS = 2000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

// ---------- map ----------
const map = L.map("map", {zoomControl:true}).setView([47.4979, 19.0402], 12);
// Same OpenStreetMap data (stops, lanes, labels), no API key. Switch layers top-right if one fails.
const osmfr = L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
  subdomains: "abc", maxZoom: 20,
  attribution: "&copy; OpenStreetMap contributors, tiles by OpenStreetMap France"
});
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Tiles &copy; Esri"
});
// OSM's own server blocks pages opened from a file:// path (no Referer); it works if the page is served over http(s).
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
});
// Served over http(s) (e.g. GitHub Pages) -> standard OSM works; opened as a local file -> use OSM France.
(location.protocol.startsWith("http") ? osm : osmfr).addTo(map);
L.control.layers({"OpenStreetMap France": osmfr, "Esri Streets": esri, "OpenStreetMap": osm}, null, {position:"topright"}).addTo(map);

// ---------- game coords -> lat/lon ----------
// Game (x,y) is treated as metres. w = A*z + B (complex similarity), relative to a Budapest origin.
// Calibrate by clicking where a player really is (1 point = offset, 2 distant points = scale + rotation).
const O = {lat:47.4979, lon:19.0402}, M = 111320, KX = M*Math.cos(O.lat*Math.PI/180);
const cmul = (a,b)=>[a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];
const cdiv = (a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d];};
const csub = (a,b)=>[a[0]-b[0],a[1]-b[1]], cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]];
let anchors = store.get("anchors", []);   // [{z:[x,y], w:[east,north]}]
$("flip").checked = store.get("flip", false);
let A=[1,0], B=[0,0];

// Built-in estimate: game (7960.5, 255.1) = Örs vezér tere M+H bus stop (BKK stop-group coordinates).
// Replace it any time with a real calibration click.
const DEF = {z:[7960.5,255.1], w:[(19.137819-O.lon)*KX, (47.503357-O.lat)*M]};
function solve(){
  A=[1,0]; B=[0,0];
  const list = anchors.length ? anchors : ($("flip").checked ? [] : [DEF]);
  if(list.length>=2){
    const p=list[list.length-2], q=list[list.length-1], dz=csub(q.z,p.z);
    if(Math.hypot(dz[0],dz[1])>50){ A=cdiv(csub(q.w,p.w),dz); B=csub(p.w,cmul(A,p.z)); return; }
  }
  if(list.length>=1){ const p=list[list.length-1]; B=csub(p.w,cmul(A,p.z)); }
}
const zOf = p => [p.x, $("flip").checked ? -p.y : p.y];
function toLatLng(p){
  if(p.lat!=null && p.lon!=null) return [p.lat,p.lon];
  const w = cadd(cmul(A,zOf(p)),B);
  return [O.lat + w[1]/M, O.lon + w[0]/KX];
}
function calText(){
  const deg = Math.atan2(A[1],A[0])*180/Math.PI, sc = Math.hypot(A[0],A[1]);
  $("calst").textContent = anchors.length
    ? `Calibrated with ${Math.min(anchors.length,2)} point(s) · scale ${sc.toFixed(3)} · rotation ${deg.toFixed(1)}°`
    : ($("flip").checked ? "Not calibrated: select a player, press Calibrate, click where they really are."
       : "Using built-in estimate (Örs vezér tere M+H). For exact placement: select a player, press Calibrate, click their real position.");
}
solve(); calText();

// ---------- state ----------
let players = [], selected = null, calMode = false, auto = true;
const markers = new Map();

function busName(path){
  const parts = String(path).split("/");
  const file = (parts.pop()||"").replace(/\.bus$/i,"");
  const model = parts.length ? parts[parts.length-1] : "";
  return model ? `${model} (${file})` : file;
}

function icon(p){
  const col = p.on_foot ? "#4cc9f0" : "#ffb703";
  let h = p.heading||0;
  if($("flip").checked) h = 180 - h;
  h -= Math.atan2(A[1],A[0])*180/Math.PI;
  const label = p.name + (!p.on_foot && p.line ? ` · ${p.line}` + (p.destination ? ` → ${p.destination}` : "") : "");
  return L.divIcon({
    className:"", iconSize:[26,26], iconAnchor:[13,13],
    html:`<div class="mk"><svg width="26" height="26" viewBox="-13 -13 26 26" style="transform:rotate(${h}deg)">
      <path d="M0-11L7 8L0 4L-7 8Z" fill="${col}" stroke="#000" stroke-width="1.5"/></svg>
      <span class="lb">${esc(label)}</span></div>`
  });
}

function renderMarkers(){
  const seen = new Set();
  for(const p of players){
    seen.add(p.id);
    const ll = toLatLng(p);
    let m = markers.get(p.id);
    if(!m){ m = L.marker(ll,{icon:icon(p)}).addTo(map); m.on("click",()=>select(p.id)); markers.set(p.id,m); }
    else { m.setLatLng(ll); m.setIcon(icon(p)); }
  }
  for(const [id,m] of markers) if(!seen.has(id)){ map.removeLayer(m); markers.delete(id); }
}

function renderList(){
  $("n").textContent = players.length;
  $("list").innerHTML = players.map(p => `
    <div class="p ${p.on_foot?"foot":""} ${p.id===selected?"sel":""}" data-id="${p.id}">
      <b>${esc(p.name)}</b>
      <small>${p.on_foot ? "On foot" : "Line <b style='display:inline;color:var(--acc)'>"+esc(p.line||"–")+"</b> → "+esc(p.destination||"–")}<br>
      ${!p.on_foot && p.tour ? "Tour: "+esc(p.tour)+"<br>" : ""}
      ${!p.on_foot && p.bus ? "Bus: "+esc(busName(p.bus))+"<br>" : ""}
      ${Math.round(p.speed_kmh||0)} km/h</small>
    </div>`).join("") || '<div class="status">Nobody online</div>';
}

function fit(){
  if(!players.length) return;
  auto = true;
  const pts = players.map(toLatLng);
  if(pts.length===1) map.setView(pts[0], Math.max(map.getZoom(),15), {animate:false});
  else map.fitBounds(L.latLngBounds(pts).pad(0.3), {animate:false, maxZoom:16});
}

function select(id){
  selected = id; renderList();
  const p = players.find(p=>p.id===id);
  if(p){ $("follow").checked=false; map.setView(toLatLng(p), Math.max(map.getZoom(),15)); }
}
$("list").onclick = e => { const el = e.target.closest(".p"); if(el) select(+el.dataset.id); };

// user interaction turns off auto-fit
["mousedown","wheel","touchstart"].forEach(ev => $("map").addEventListener(ev, ()=>{ $("follow").checked=false; }, {passive:true}));

// ---------- calibration ----------
$("cal").onclick = () => {
  const p = players.find(p=>p.id===selected) || (players.length===1 ? players[0] : null);
  if(!p){ $("calst").textContent = "Select a player in the list first."; return; }
  selected = p.id; calMode = true; $("cal").classList.add("on"); $("map").classList.add("cal");
  $("calst").textContent = `Click the map where ${p.name} actually is…`;
};
map.on("click", e => {
  if(!calMode) return;
  const p = players.find(p=>p.id===selected); if(!p) return;
  const w = [(e.latlng.lng-O.lon)*KX, (e.latlng.lat-O.lat)*M];
  anchors.push({z:zOf(p), w}); anchors = anchors.slice(-2); store.set("anchors", anchors);
  calMode=false; $("cal").classList.remove("on"); $("map").classList.remove("cal");
  solve(); calText(); renderMarkers(); renderList();
});
$("reset").onclick = () => { anchors=[]; store.set("anchors",[]); solve(); calText(); renderMarkers(); };
$("flip").onchange = () => { store.set("flip",$("flip").checked); anchors=[]; store.set("anchors",[]); solve(); calText(); renderMarkers(); if($("follow").checked) fit(); };

// ---------- polling ----------
$("url").value = store.get("url", DEFAULT_URL);
$("url").onchange = () => { store.set("url",$("url").value); poll(); };

async function poll(){
  try{
    const res = await fetch($("url").value, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    players = data.filter(p => (typeof p.x==="number" && typeof p.y==="number") || (p.lat!=null && p.lon!=null));
    $("st").className="status ok"; $("st").textContent="updated "+new Date().toLocaleTimeString();
    renderMarkers(); renderList();
    if($("follow").checked) fit();
  }catch(err){
    $("st").className="status err";
    $("st").textContent="can't reach server ("+err.message+"). Is the tunnel up and CORS enabled?";
  }
}
poll(); setInterval(poll, POLL_MS);
</script>
</body>
</html>
