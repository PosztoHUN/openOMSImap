<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>openOMSI játékosok</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111318;
            color: #eeeeee;
        }

        header {
            background: #1b1e24;
            padding: 25px;
            border-bottom: 1px solid #30343c;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
        }

        .subtitle {
            color: #9da3ad;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 15px;
            background: #1b1e24;
            border: 1px solid #30343c;
            border-radius: 8px;
        }

        .status-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #35c759;
        }

        .status-dot.error {
            background: #ff453a;
        }

        .status-text {
            color: #cfd3da;
        }

        .players {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
        }

        .player {
            background: #1b1e24;
            border: 1px solid #30343c;
            border-radius: 10px;
            padding: 18px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .player-name {
            font-size: 21px;
            font-weight: bold;
        }

        .route {
            background: #e8b900;
            color: #111318;
            padding: 5px 9px;
            border-radius: 6px;
            font-weight: bold;
        }

        .destination {
            font-size: 18px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .info {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 7px 10px;
            font-size: 14px;
        }

        .label {
            color: #8f96a3;
        }

        .value {
            color: #e5e7eb;
            overflow-wrap: anywhere;
        }

        .empty {
            padding: 35px;
            text-align: center;
            background: #1b1e24;
            border: 1px solid #30343c;
            border-radius: 10px;
            color: #999fa9;
        }

        .error {
            background: #32191a;
            border: 1px solid #713335;
            color: #ffb4b4;
            padding: 18px;
            border-radius: 10px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;
            color: #707783;
            font-size: 13px;
        }

        code {
            background: #252932;
            padding: 2px 5px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<header>
    <h1>🚌 openOMSI játékosok</h1>
    <div class="subtitle">Élő játékoslista</div>
</header>

<main>

    <div class="status">
        <div id="statusDot" class="status-dot"></div>
        <div id="statusText" class="status-text">
            Kapcsolódás a szerverhez...
        </div>
    </div>

    <div id="players" class="players">
        <div class="empty">
            Játékoslista betöltése...
        </div>
    </div>

    <div class="footer">
        Automatikus frissítés: 5 másodpercenként
    </div>

</main>

<script>
    const API_URL =
        "https://kong-conditions-drain-purposes.trycloudflare.com/players";

    const playersElement = document.getElementById("players");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");

    function escapeHtml(value) {
        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function getBusName(path) {
        if (!path) {
            return "Ismeretlen";
        }

        const normalized = path.replaceAll("\\", "/");

        const parts = normalized.split("/");

        if (parts.length >= 2) {
            return parts[parts.length - 2];
        }

        return path;
    }

    function getBusFile(path) {
        if (!path) {
            return "Ismeretlen";
        }

        const normalized = path.replaceAll("\\", "/");

        const parts = normalized.split("/");

        return parts[parts.length - 1];
    }

    function formatNumber(value, decimals = 1) {
        if (value === null || value === undefined) {
            return "—";
        }

        const number = Number(value);

        if (!Number.isFinite(number)) {
            return "—";
        }

        return number.toFixed(decimals);
    }

    function renderPlayers(players) {

        if (!Array.isArray(players)) {
            throw new Error("Az API válasza nem játékoslista.");
        }

        if (players.length === 0) {
            playersElement.innerHTML = `
                <div class="empty">
                    Jelenleg nincs játékos a szerveren.
                </div>
            `;

            return;
        }

        playersElement.innerHTML = players.map(player => {

            const busName = getBusName(player.bus);
            const busFile = getBusFile(player.bus);

            return `
                <div class="player">

                    <div class="player-header">

                        <div class="player-name">
                            ${escapeHtml(player.name || "Ismeretlen játékos")}
                        </div>

                        <div class="route">
                            ${escapeHtml(player.line || "—")}
                        </div>

                    </div>

                    <div class="destination">
                        → ${escapeHtml(player.destination || "Nincs célállomás")}
                    </div>

                    <div class="info">

                        <div class="label">Jármű</div>
                        <div class="value">
                            ${escapeHtml(busName)}
                        </div>

                        <div class="label">Busz fájl</div>
                        <div class="value">
                            ${escapeHtml(busFile)}
                        </div>

                        <div class="label">Menet</div>
                        <div class="value">
                            ${escapeHtml(player.tour || "—")}
                        </div>

                        <div class="label">Sebesség</div>
                        <div class="value">
                            ${formatNumber(player.speed_kmh, 1)} km/h
                        </div>

                        <div class="label">Irány</div>
                        <div class="value">
                            ${formatNumber(player.heading, 1)}°
                        </div>

                        <div class="label">OMSI X</div>
                        <div class="value">
                            ${formatNumber(player.x, 1)}
                        </div>

                        <div class="label">OMSI Y</div>
                        <div class="value">
                            ${formatNumber(player.y, 1)}
                        </div>

                        <div class="label">Gyalog</div>
                        <div class="value">
                            ${player.on_foot ? "Igen" : "Nem"}
                        </div>

                        <div class="label">Játékos ID</div>
                        <div class="value">
                            ${escapeHtml(player.id)}
                        </div>

                    </div>

                </div>
            `;
        }).join("");
    }

    async function loadPlayers() {

        try {

            const response = await fetch(
                API_URL + "?t=" + Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP hiba: " + response.status
                );
            }

            const text = await response.text();

            let data;

            try {
                data = JSON.parse(text);
            }
            catch (error) {
                console.error(
                    "A szerver nem JSON-t adott vissza:",
                    text
                );

                throw new Error(
                    "Az API nem JSON választ adott vissza."
                );
            }

            renderPlayers(data);

            statusDot.classList.remove("error");

            statusText.textContent =
                "Szerver kapcsolat rendben • " +
                data.length +
                " játékos";

        }
        catch (error) {

            console.error(
                "Játékoslista hiba:",
                error
            );

            statusDot.classList.add("error");

            statusText.textContent =
                "API kapcsolat hiba";

            playersElement.innerHTML = `
                <div class="error">
                    <strong>API hiba</strong><br><br>

                    Nem sikerült lekérni a játékoslistát.<br><br>

                    <small>
                        ${escapeHtml(error.message)}
                    </small>
                </div>
            `;
        }
    }

    // Első betöltés
    loadPlayers();

    // Frissítés 5 másodpercenként
    setInterval(loadPlayers, 5000);
</script>

</body>
</html>
